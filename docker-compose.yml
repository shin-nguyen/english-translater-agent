services:
  postgres:
    image: postgres:16-alpine
    container_name: translator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-translator}
      POSTGRES_USER: ${POSTGRES_USER:-translator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-translator}
    ports:
      - "5432:5432"
    volumes:
      - translator-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-translator} -d ${POSTGRES_DB:-translator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: en-translator-backend:latest
    build:
      context: ./backend
    container_name: translator-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-translator}
      DB_USERNAME: ${POSTGRES_USER:-translator}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-translator}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    image: en-translator-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: translator-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  translator-pgdata:
