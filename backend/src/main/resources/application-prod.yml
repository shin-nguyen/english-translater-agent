spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt-secret: ${APP_JWT_SECRET}
    ai-key-encryption-key: ${AI_MODEL_ENCRYPTION_KEY}

logging:
  level:
    com.example.translator: INFO
