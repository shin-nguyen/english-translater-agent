spring:
  application:
    name: translator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:}
    jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:1440}
    ai-key-encryption-key: ${AI_MODEL_ENCRYPTION_KEY:}
